# Root-level CI pipeline for octo-communication-sdk, using shared templates
# from octo-pipeline-templates@tpl-v0.4.2.
#
# This repo was carved out of octo-sdk in Phase 3 of the YAML migration. Its
# build is structurally the same as octo-sdk's: NuGets (5), one Docker image
# for the plug-simulation sample adapter, one Helm chart, API docs.
#
# resources.pipelines watches the upstream Libs trains (DEH + CK-Engine for
# transitive deps, SDK + Common-Services for the actual Sdk.Common /
# Sdk.ServiceClient packages this repo consumes). When any of them publish a
# fresh main build, the Communication-SDK CI re-fires to pick up the new
# NuGets.

name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

resources:
  pipelines:
    # Only octo-sdk needed — it transitively depends on DEH + CK-Engine (its
    # own resources.pipelines re-fires it when those build), and once it
    # publishes the slim Sdk.Common / Sdk.ServiceClient / Communication.Contracts
    # we want to rebuild against, this repo fires too. octo-common-services is
    # NOT a dependency here (no Sdk.Pipeline / Sdk.Adapters / Web project
    # references it).
    - pipeline: octo-sdk
      source: octo-sdk-CI
      trigger:
        branches:
          include:
            - main
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v0.4.9
    - repository: helmChartBuild
      type: github
      name: meshmakers/helm-chart-build
      endpoint: meshmakers-access-token
      ref: refs/heads/main

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.CommunicationSdk.slnx'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}

stages:
  - stage: Build
    jobs:
      - job: buildCommunicationSdk
        displayName: 'Build NuGets, tests, plug-simulation image + chart'
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
          # Derives $(ChartVersion) — strict 3-segment SemVer for Helm — from
          # Build.BuildNumber. Same pattern octo-sdk uses for its chart.
          - template: ci-templates/derive-chart-version.yml@helmChartBuild
          - checkout: self
            clean: true
          - template: templates/steps/set-version.yml@pipelineTemplates
          - template: templates/steps/download-ca.yml@pipelineTemplates
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(SolutionFile)'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true
          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: $(SolutionFile)
              arguments: '--no-restore --configuration $(BuildConfiguration) /p:OctoNugetPrivateServer=$(nugetPrivateServer) /p:OctoPrivateGitHubApiKey=$(GitHubPAT) /p:OctoPublicGitHubApiKey=$(GitHubPAT)'
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          # No tests yet — the moved test projects (Sdk.Common.Tests,
          # Sdk.Common.IntegrationTests, Sdk.Common.PipelineParityTests) still
          # need to land in this repo. Phase 3.5 follow-up.
          - template: templates/steps/build-and-push-docker.yml@pipelineTemplates
            parameters:
              publicRegistryServiceConnection: $(DockerRegistryPublicConnection)
              privateRegistryName: $(DockerRegistryPrivateUri)
              repository: meshmakers/octo-communication-adapter-simulation
              dockerfile: src/Sdk.Plug.Simulation/Dockerfile
              platforms: 'linux/arm64,linux/amd64'
          # ChartVersion derived above; mirrors octo-sdk's plug-simulation chart
          # release flow exactly.
          - task: HelmDeploy@0
            displayName: 'helm package octo-plug-simulation'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/charts/octo-plug-simulation'
              chartVersion: '$(ChartVersion)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber) --dependency-update'
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: dev
              chartName: octo-plug-simulation
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-plug-simulation-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isMain, true))
          - template: ci-templates/publish-helm-chart.yml@helmChartBuild
            parameters:
              channel: release
              chartCategory: adapter
              chartName: octo-plug-simulation
              chartVersion: $(ChartVersion)
              chartTgzPath: $(Build.artifactstagingdirectory)/octo-plug-simulation-$(ChartVersion).tgz
              githubTokenVariable: HelmChartBuildGhToken
              condition: and(succeeded(), eq(variables.isRelease, true))
          - task: PowerShell@2
            displayName: 'Create documentation'
            inputs:
              filePath: '$(System.DefaultWorkingDirectory)/scripts/createDocumentation.ps1'
              arguments: '-configuration $(buildConfiguration)'
          - template: templates/steps/handle-artifacts.yml@pipelineTemplates
            parameters:
              apiDocumentationPaths:
                - '$(Build.SourcesDirectory)/bin/$(buildConfiguration)/documentation'
          - template: templates/steps/push-nuget-package.yml@pipelineTemplates
