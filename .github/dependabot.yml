# Dependabot keeps the NuGet references and the plug-simulation Dockerfile base
# image tags current.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Microsoft.OpenApi stays on the 2.x line: Microsoft.AspNetCore.OpenApi 10.0.x requires [2.7.5, 3.0.0) (NU1608).
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/src/Sdk.Plug.Simulation"
    schedule:
      interval: "weekly"
    ignore:
      # A new .NET major is a platform decision, not a Dependabot bump.
      - dependency-name: "mcr.microsoft.com/dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mcr.microsoft.com/dotnet/runtime"
        update-types: ["version-update:semver-major"]
